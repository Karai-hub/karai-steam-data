name: Update Steam library

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-library:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch current Steam library
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python scripts/update_library.py

      - name: Commit updated data
        run: |
          git config user.name "steam-library-bot"
          git config user.email "steam-library-bot@users.noreply.github.com"
          git add library.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Steam library"
            git push
          fi

