name: Update Steam data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-steam-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Steam library, wishlist and DLC catalog
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_COUNTRY_CODE: RU
          STEAM_LANGUAGE: russian
        run: python scripts/update_steam_data.py

      - name: Commit updated data
        run: |
          git config user.name "steam-data-bot"
          git config user.email "steam-data-bot@users.noreply.github.com"
          git add library.json wishlist.json dlc_catalog.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Steam library, wishlist and DLC catalog"
            git push
          fi
